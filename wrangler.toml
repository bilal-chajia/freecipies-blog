name = "recipes-saas"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat_v2", "no_handle_cross_request_promise_resolution"]
# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "freecipies-db"
database_id = "8c953b64-1d9c-4b61-a949-75008940914d"
preview_database_id = "local-dev"  # Local SQLite for dev mode

# R2 Buckets
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "saas-blog-images"
preview_bucket_name = "saas-blog-images"

# ──────────────────────────────────────────────────
# Environment Variables
# ──────────────────────────────────────────────────
# Production values live here in [vars].
# For local development (`pnpm preview`), .dev.vars
# overrides these automatically. See .env.example
# for the full list of available variables.
#
# Secrets (JWT_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD)
# are set via:
#   - `npx wrangler secret put <KEY>` for production
#   - `.dev.vars` file for local development
# ──────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
R2_PUBLIC_URL = "https://pub-8c953b641d9c4b61a94975008940914d.r2.dev"
SITE_URL = "https://recipes-saas.chajia-bilal23.workers.dev"

# KV Namespaces (for sessions)
[[kv_namespaces]]
binding = "SESSION"
id = "b16e75cac6c64f029a8f173ad8083124"
preview_id = "local-session-kv"  # Local KV for dev mode
